<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Apple SD Gothic Neo, Pretendard, sans-serif">
  <!-- 배경: 크림 -->
  <rect width="390" height="844" fill="#FAF6F0"/>

  <!-- 상단 장식: 따옴표 마크 -->
  <text x="195" y="210" font-size="64" fill="#D9694C" text-anchor="middle" font-family="Georgia, serif">&#8220;</text>

  <!-- 워드마크 -->
  <text x="195" y="290" font-size="44" font-weight="700" fill="#2B2723" text-anchor="middle" font-family="Georgia, serif" letter-spacing="2">프롤로그</text>

  <!-- 태그라인 -->
  <text x="195" y="330" font-size="15" fill="#8A8178" text-anchor="middle">하루 한 문답, 서로를 알아가는</text>
  <text x="195" y="354" font-size="15" fill="#8A8178" text-anchor="middle">가치관 블라인드 소개팅</text>

  <!-- 카카오 -->
  <rect x="25" y="500" width="340" height="56" rx="14" fill="#FEE500"/>
  <circle cx="58" cy="528" r="11" fill="#2B2723"/>
  <text x="58" y="532" font-size="12" fill="#FEE500" text-anchor="middle" font-weight="700">k</text>
  <text x="195" y="533" font-size="16" font-weight="600" fill="#191600" text-anchor="middle">카카오로 시작하기</text>

  <!-- 네이버 -->
  <rect x="25" y="568" width="340" height="56" rx="14" fill="#03C75A"/>
  <text x="58" y="603" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="800">N</text>
  <text x="195" y="601" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">네이버로 시작하기</text>

  <!-- 구글 -->
  <rect x="25" y="636" width="340" height="56" rx="14" fill="#FFFFFF" stroke="#E7DDCD" stroke-width="1.5"/>
  <text x="58" y="671" font-size="20" fill="#4285F4" text-anchor="middle" font-weight="800">G</text>
  <text x="195" y="669" font-size="16" font-weight="600" fill="#2B2723" text-anchor="middle">구글로 시작하기</text>

  <!-- 애플 (iOS 전용) -->
  <rect x="25" y="704" width="340" height="56" rx="14" fill="#111111"/>
  <text x="58" y="740" font-size="22" fill="#FFFFFF" text-anchor="middle"></text>
  <text x="195" y="737" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Apple로 시작하기</text>
  <text x="343" y="694" font-size="10" fill="#8A8178" text-anchor="end">iOS 전용</text>

  <!-- 약관 -->
  <text x="195" y="800" font-size="11" fill="#A89C8C" text-anchor="middle">시작하면 이용약관 및 개인정보처리방침에 동의합니다</text>
</svg>
