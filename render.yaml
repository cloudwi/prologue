# Render Blueprint — https://render.com/docs/blueprint-spec
# 대시보드에서 "New +" → "Blueprint"로 이 파일을 읽으면 서비스가 자동 구성됩니다.
services:
  - type: web
    name: prologue-web
    runtime: static
    repo: https://github.com/cloudwi/prologue
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true

  # ── 스테이징 백엔드 ────────────────────────────────────────────
  # 배포 전 리허설 자리. **DB는 반드시 별도 Supabase 프로젝트**로 붙인다 —
  # 운영 DB를 공유하면 마이그레이션 리허설이 곧 운영 사고가 된다(V49 같은 변경을 여기서 먼저 돌린다).
  # 무료 티어라 잠들지만 스테이징에는 문제없다.
  #
  # 앱에서 이 서버를 보려면 eas.json의 preview 프로파일(EXPO_PUBLIC_API_URL)로 한 번 빌드해
  # 폰에 깔고, 이후에는 `eas update --branch preview`로 재빌드 없이 확인한다.
  - type: web
    name: prologue-backend-staging
    runtime: docker
    repo: https://github.com/cloudwi/prologue
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true            # 스테이징은 늘 최신 main — 여기서 먼저 깨지라고 있는 자리다
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      # ⚠️ 운영과 **다른** Supabase 프로젝트를 넣을 것. 같은 값을 넣으면 스테이징이 아니다.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: prologue-backend
    runtime: docker
    repo: https://github.com/cloudwi/prologue
    branch: main
    rootDir: backend            # 모노레포에서 백엔드 폴더를 빌드 컨텍스트로
    dockerfilePath: ./Dockerfile
    region: singapore           # 한국에서 가장 가까운 무료 리전 (Supabase도 Singapore로 맞추기)
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true            # main 푸시 시 자동 재배포
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true     # Render가 안전한 랜덤값 생성
      # ── 아래 3개는 Supabase 프로젝트 만든 뒤 대시보드에서 입력 ──
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
