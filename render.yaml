# Render Blueprint — https://render.com/docs/blueprint-spec
# 대시보드에서 "New +" → "Blueprint"로 이 파일을 읽으면 서비스가 자동 구성됩니다.
services:
  - type: web
    name: prologue-web
    runtime: static
    repo: https://github.com/cloudwi/prologue
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # 캐시 — 기본값이 max-age=0이라 재방문자가 매번 전부 다시 받고 있었다(2026-08-28).
    headers:
      # 해시가 붙은 자산은 내용이 바뀌면 **이름이 바뀐다.** 그래서 영원히 캐시해도 안전하고,
      # 그래야 두 번째 방문이 공짜가 된다.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # 이미지·아이콘은 이름이 그대로라 영원히는 못 준다. 하루 물고, 그 뒤엔 서버에 되묻되
      # 바뀐 게 없으면 304로 끝난다(stale-while-revalidate).
      - path: /*.png
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      # HTML은 짧게. 배포하면 바로 보여야 한다.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
    # 모임 초대장(/m/{id})만 백엔드가 그린다.
    # 미리보기(OG 태그)는 크롤러가 JS를 돌리지 않고 읽어 가므로 응답 본문에 이미 들어 있어야 하는데,
    # 정적 사이트는 유저가 방금 만든 모임의 페이지를 미리 구워둘 수 없다. 그렇다고 앱이 api.prologue.day를
    # 공유하게 두면 그 주소가 앱 바이너리에 박혀 영영 못 옮긴다 — 그래서 대문은 prologue.day로 두고 여기서 넘긴다.
    routes:
      # 공개 모임 목록 — 검색에 걸리라고 만든 페이지. 백엔드가 그린다(모임은 배포 때 굽는
      # 정적 사이트로는 담을 수 없다). 주소는 /meetups지만 백엔드에서는 /m이다 —
      # api.prologue.day/meetups는 이미 JSON API의 자리라서.
      - type: rewrite
        source: /meetups
        destination: https://api.prologue.day/m
      - type: rewrite
        source: /m/*
        destination: https://api.prologue.day/m/*

  - type: web
    name: prologue-backend
    runtime: docker
    repo: https://github.com/cloudwi/prologue
    branch: main
    rootDir: backend            # 모노레포에서 백엔드 폴더를 빌드 컨텍스트로
    dockerfilePath: ./Dockerfile
    region: singapore           # 한국에서 가장 가까운 무료 리전 (Supabase도 Singapore로 맞추기)
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true            # main 푸시 시 자동 재배포
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true     # Render가 안전한 랜덤값 생성
      # 메일·공유 링크·초대장이 달고 나가는 대문 주소. 비밀이 아니라서 여기 평문으로 적는다 —
      # 대시보드에만 넣어두면 레포만 봐서는 프로드가 어느 도메인을 쓰는지 알 수 없다.
      - key: WEB_BASE_URL
        value: https://prologue.day
      # 프로필 사진 검수(Google Cloud Vision). 키가 비면 검수를 통째로 건너뛰고 전부 통과시킨다 —
      # 사진을 올리는 앱이 필터 없이 심사에 들어가면 1.2(UGC)에서 되돌아온다. 대시보드에서 넣는다.
      - key: GOOGLE_VISION_API_KEY
        sync: false
      # 모임을 열 수 있는 사람 — 쉼표로 구분한 이메일 허용목록(MeetupHostPolicy).
      #
      # **비워 두면 제한이 풀려 누구나 연다.** 기능을 전체 공개할 때 배포 없이 이 값만
      # 비우면 되도록 그렇게 짰다. 반대로 코드 기본값은 잠금 쪽이라, 값을 안 넣으면
      # 운영자(cloudwi@naver.com)만 열 수 있다.
      #
      # 열기 전에 모임 심사(PENDING → 승인)가 돌고 있어야 한다 — 그게 없으면 아무나
      # 우리 이름으로 사람을 모으고 참가비를 받는다.
      - key: MEETUP_HOST_EMAILS
        sync: false
      # 강제 업데이트 — 이 버전 미만은 앱이 열리지 않고 스토어로 보내는 화면에 막힌다.
      #
      # **값은 대시보드에서만 넣는다(sync: false).** 사람을 앱에서 잠그는 스위치라, 잘못
      # 걸었을 때 되돌리는 데 배포 5분을 기다릴 수 없다. 여기 값을 적어두면 다음 배포가
      # 대시보드 수정을 덮어써서 그 5분이 강제된다.
      #
      # 올리기 전에 확인할 것: **양쪽 스토어에 그 버전이 실제로 가 있는가.** iOS는
      # READY_FOR_SALE, 안드로이드는 그 사람이 받을 수 있는 트랙(프로덕션, 또는 테스터라면
      # 알파·내부 전부)에 올라가 있어야 한다. 한쪽이라도 비어 있으면 갈 곳 없이 막힌다.
      #
      # 값이 비면 1.0.0 — 아무도 막지 않는다(application.yaml의 기본값).
      - key: APP_MIN_SUPPORTED_VERSION
        sync: false
      # 스토어에 올라가 있는 최신 버전. 지금은 앱이 쓰지 않지만 "새 버전이 나왔어요" 안내의 자리.
      - key: APP_LATEST_VERSION
        sync: false
      # ── 아래 3개는 Supabase 프로젝트 만든 뒤 대시보드에서 입력 ──
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
