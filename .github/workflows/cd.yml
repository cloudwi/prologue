name: CD

# 배포만 한다 — 검증은 ci.yml이 이미 끝냈다.
#
# main의 CI가 **초록일 때만** Render 배포를 부른다. 이게 CI/CD를 나누는 이유다:
# 예전에는 푸시가 곧 배포(Render autoDeploy)라, 테스트가 관문 노릇을 전혀 못 했다.
#
# ── 켜기 전에 사람이 해야 할 두 가지 ──────────────────────────────
# 1) Render 대시보드에서 두 서비스의 **Auto-Deploy를 끄고**, 각각 Deploy Hook URL을 만든다
#    (Settings → Deploy Hook). render.yaml의 autoDeploy도 false로 바꾼다.
# 2) 그 URL을 GitHub 리포지토리 시크릿에 넣는다:
#    RENDER_DEPLOY_HOOK_BACKEND, RENDER_DEPLOY_HOOK_WEB
#
# 시크릿이 없으면 이 워크플로는 **조용히 건너뛴다** — 순서를 거꾸로 밟아
# (autoDeploy만 끄고 시크릿을 안 넣어) 배포가 통째로 멈추는 일을 막기 위해서다.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Render 배포
    runs-on: ubuntu-latest
    # 수동 실행이 아니면 CI가 성공했을 때만.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 백엔드
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_BACKEND 시크릿이 없어 건너뜁니다(아직 Render autoDeploy가 배포 중일 것)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "백엔드 배포를 요청했습니다."

      - name: 웹
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_WEB 시크릿이 없어 건너뜁니다."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "웹 배포를 요청했습니다."

# 앱(EAS OTA)은 일부러 넣지 않았다.
# main에 푸시할 때마다 실사용자에게 업데이트가 나가는 건 위험하고,
# 백엔드가 먼저 떠야 하는 변경(마이그레이션 등)에서는 순서를 사람이 정해야 한다.
# 필요해지면 workflow_dispatch로 수동 실행하는 별도 워크플로를 두는 편이 낫다.
