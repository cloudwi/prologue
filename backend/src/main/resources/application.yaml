spring:
  application:
    name: backend
  # DataSource는 환경변수로 주입 (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD)
  jpa:
    hibernate:
      ddl-auto: validate     # 스키마는 Flyway로 관리 (도메인 설계 후 추가)
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health       # /actuator/health 만 외부 노출
  endpoint:
    health:
      show-details: never     # UptimeRobot 핑 대상이라 상세정보 숨김
  health:
    db:
      enabled: true           # 핑 시 DB도 함께 깨움 → Supabase 일시정지 방지
