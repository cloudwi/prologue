spring:
  application:
    name: backend
  # DataSource는 환경변수로 주입 (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD)
  jpa:
    hibernate:
      ddl-auto: none         # 스키마는 Flyway가 단일 소스로 관리 (추후 Testcontainers로 validate 강화)
    open-in-view: false
  flyway:
    enabled: true            # classpath:db/migration 의 V*.sql 자동 실행
  servlet:
    multipart:               # 프로필 사진 업로드 크기 제한. 요즘 폰 사진은 6MB를 넘기는 일이 잦아 12MB로 둔다.
      max-file-size: 12MB
      max-request-size: 12MB

# 프로필 사진 저장소(Supabase Storage HTTP API). Render가 SMTP는 막지만 오브젝트 스토리지는 HTTPS라 가능.
# 환경변수 미설정 시 업로드는 503(STORAGE_NOT_CONFIGURED). 버킷은 public이어야 반환 URL로 조회됨.
#   SUPABASE_URL=<https://xxx.supabase.co>, SUPABASE_SERVICE_KEY=<service_role 키>, (선택)SUPABASE_STORAGE_BUCKET
supabase:
  storage:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-photos}

daily:
  # 하루에 소개하는 상대 수. 유저가 적을 땐 1 — 후보 풀이 얕은데 둘씩 태우면 금방 마른다.
  reveal-count: ${DAILY_REVEAL_COUNT:1}
  # 후보를 찾을 질문의 범위(일). 사람이 늘면 1에 가깝게 좁힌다.
  candidate-days: ${DAILY_CANDIDATE_DAYS:7}
  # 한 사람이 하루에 소개될 수 있는 최대 횟수. 성비가 기울면 적은 쪽에 노출이 몰려
  # 하트와 알림이 쌓이고, 그 피로가 먼저 떠나게 만든다.
  max-exposure-per-day: ${DAILY_MAX_EXPOSURE_PER_DAY:3}
  # 첫 범위에서 후보가 비면 순서대로 넓혀 보는 범위(일). 질문과 무관하게 그 기간에 답한 사람을 가장 최근 답으로 소개.
  candidate-fallback-days: ${DAILY_CANDIDATE_FALLBACK_DAYS:30,90}
  # 새 후보가 아무도 없을 때, 이미 만난 사람을 다시 소개하기까지의 최소 간격(일). 그 사이 새 답을 남긴 사람만.
  reintroduce-after-days: ${DAILY_REINTRODUCE_AFTER_DAYS:14}

# 프로필 사진 검수(Google Cloud Vision images:annotate) — 얼굴이 담긴 사진인지 + 선정성 판정.
# 키가 없으면 검수를 건너뛰고 모두 통과시킨다(로컬·개발에서 업로드가 막히지 않도록). 호출 실패도 통과.
# 과금은 기능 단위 — 사진 1장당 FACE_DETECTION + SAFE_SEARCH_DETECTION = 2유닛(월 1,000유닛 무료, 이후 1,000유닛당 $1.5).
#   GOOGLE_VISION_API_KEY=<Cloud Vision API가 켜진 프로젝트의 API 키>
photo:
  inspection:
    google-vision-api-key: ${GOOGLE_VISION_API_KEY:}

# 이메일 인증코드 발송(Resend HTTP API). Render가 SMTP 포트를 막아 SMTP 대신 HTTPS로 발송.
# RESEND_API_KEY 환경변수가 있을 때만 ResendEmailSender 활성(@ConditionalOnProperty),
# 없으면 LoggingEmailSender(dev stub) 사용. api-key는 빈 기본값 트랩을 피하려 yaml에 두지 않고
# RESEND_API_KEY 환경변수(relaxed binding)로만 주입한다.
#   RESEND_API_KEY=<Resend API 키>
#   RESEND_FROM=<발신주소> (도메인 인증 전엔 기본값 onboarding@resend.dev 사용)
resend:
  from: ${RESEND_FROM:프롤로그 <onboarding@resend.dev>}

# 앱스토어 심사용 데모 계정 — 이 이메일은 메일 발송 없이 아래 고정 코드로 로그인된다.
# 심사 통과 후엔 이 블록을 지우고 배포하면 통로가 닫힌다(앱 업데이트 심사 때 다시 필요하니 그때 복구).
# 급하게 끌 일이 생기면 Render에 REVIEW_CODE= (빈 값) 환경변수를 넣어도 된다.
review:
  email: ${REVIEW_EMAIL:review@prologue.day}
  code: ${REVIEW_CODE:741930}

# 앱 클라이언트 설정 — 부팅 시 /app-config로 내려간다.
# 앱은 강제 업데이트가 안 되니 유저 폰에는 옛 버전이 계속 남는다. 서버가 하위 호환을 깨야 할 때
# min-supported-version을 올리면 그 미만 앱은 스토어로 보내는 화면에 막힌다.
# 올리기 전에 스토어에 새 버전이 이미 심사를 통과해 올라가 있어야 한다 — 안 그러면 갈 곳이 없다.
app:
  min-supported-version: ${APP_MIN_SUPPORTED_VERSION:1.0.0}
  latest-version: ${APP_LATEST_VERSION:1.0.0}
  ios-store-url: ${APP_IOS_STORE_URL:https://apps.apple.com/kr/app/id6803755105}
  android-store-url: ${APP_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=day.prologue.app}

# 바깥으로 나가는 링크가 전부 이 주소를 앞에 달고 나간다 — 인증코드 메일(/auth?code=),
# 추천 공유 링크(/download?ref=), 모임 초대장(/m/{id}).
# 그래서 이 값이 틀리면 유저 눈에 먼저 보인다. 받는 사람에게 낯선 도메인이 찍힌 인증 메일은
# 링크가 살아 있어도 피싱으로 읽힌다. 기본값을 대문 도메인으로 두는 이유다.
web:
  base-url: ${WEB_BASE_URL:https://prologue.day}

# 에러 모니터링(Sentry). DSN이 비어 있으면 초기화 자체를 건너뛴다 — 로컬·테스트에서 무해.
# 초기화는 config/SentryConfig, 이벤트 수집은 logback 어펜더(ERROR 로그)가 맡는다.
sentry:
  dsn: ${SENTRY_DSN:}

jwt:
  secret: ${JWT_SECRET}          # 운영: Render 환경변수(자동생성). 로컬: 환경변수로 주입
  access-token-expiry: 30m       # 액세스 토큰 30분
  refresh-token-expiry: 14d      # 리프레시 토큰 14일

management:
  endpoints:
    web:
      exposure:
        include: health       # /actuator/health 만 외부 노출
  endpoint:
    health:
      show-details: never     # UptimeRobot 핑 대상이라 상세정보 숨김
  health:
    db:
      enabled: true           # 핑 시 DB도 함께 깨움 → Supabase 일시정지 방지

# 스토어 결제 검증(잉크 충전). 자격증명이 없으면 그 플랫폼의 결제는 거절된다 — 잉크는 돈이라 닫힌 쪽이 기본값.
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=<Play Console에 초대된 서비스 계정 키 JSON 전체(한 줄)>
#   서비스 계정에는 Play Console "재무 데이터 보기" 권한이 있어야 purchases.products.get이 열린다.
store:
  google-play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:day.prologue.app}
    service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}

