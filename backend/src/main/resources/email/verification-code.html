<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프롤로그 인증코드</title>
</head>
<body style="margin:0;padding:0;background:#F3EDE4;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F3EDE4;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:460px;background:#FAF6F0;border-radius:20px;">
        <tr>
          <td style="padding:8px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#FFFFFF;border-radius:16px;border:1px solid #EFE6D8;">
              <tr>
                <td style="padding:40px 40px 34px;font-family:-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif;">

                  <!-- 워드마크 -->
                  <div style="font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:700;letter-spacing:2px;color:#2B2723;">프롤로그</div>
                  <div style="font-size:10px;font-weight:700;letter-spacing:5px;color:#D9694C;margin-top:5px;">PROLOGUE</div>

                  <!-- 구분선 -->
                  <div style="height:1px;background:#EFE6D8;margin:26px 0;"></div>

                  <!-- 안내 -->
                  <div style="font-size:13px;letter-spacing:3px;color:#8A8178;font-weight:600;">인증코드</div>
                  <div style="font-size:16px;line-height:1.6;color:#2B2723;margin-top:10px;">
                    아래 <b>6자리 코드</b>를 앱에 입력하면<br>로그인이 완료돼요.
                  </div>

                  <!-- 코드 박스 -->
                  <div style="margin:24px 0 8px;background:#FBEDE6;border:1px solid #F0D9CD;border-radius:14px;padding:22px 0;text-align:center;">
                    <span style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:38px;font-weight:700;letter-spacing:12px;color:#D9694C;padding-left:12px;">{{code}}</span>
                  </div>

                  <!-- 복사 안내 · 만료 -->
                  <div style="font-size:13px;color:#8A8178;text-align:center;margin-top:14px;line-height:1.7;">
                    코드를 길게 누르면 복사할 수 있어요<br>
                    <b style="color:#2B2723;">5분</b> 안에 입력해 주세요
                  </div>

                  <!-- 하단 안내 -->
                  <div style="height:1px;background:#EFE6D8;margin:30px 0 20px;"></div>
                  <div style="font-size:12px;line-height:1.7;color:#A89C8C;">
                    본인이 요청하지 않았다면 이 메일은 무시하셔도 괜찮아요.<br>
                    누군가 실수로 이메일을 입력했을 수 있어요.
                  </div>

                </td>
              </tr>
            </table>

            <!-- 푸터 -->
            <div style="text-align:center;padding:20px 12px 10px;font-family:-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif;font-size:12px;color:#A89C8C;line-height:1.6;">
              <span style="color:#8A8178;font-weight:600;">프롤로그</span> · 하루 한 문답, 서로를 알아가는<br>
              가치관 소개팅
            </div>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
</body>
</html>
