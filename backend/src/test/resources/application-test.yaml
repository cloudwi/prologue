# 테스트 프로파일 — 컨텍스트가 실제로 뜨는지 확인하기 위한 최소 덮어쓰기.
#
# 이 설정이 없을 때 contextLoads()는 DataSource가 없어 늘 실패했다. 그래서 빈 배선 오류가
# 로컬에서 한 번도 걸리지 않고 배포까지 갔다 — PurchaseVerifier 빈이 등록되지 않아
# 애플리케이션이 기동하지 못한 일이 그것이다.
#
# 파일 이름이 application.yaml이면 운영 설정을 통째로 가린다(테스트 클래스패스가 앞선다).
# 프로파일 파일로 두어야 본 설정을 그대로 읽고 필요한 값만 덮어쓴다.
#
# 여기서 잡으려는 건 SQL이 아니라 "애플리케이션이 뜨는가"라서 인메모리로 충분하다.
spring:
  datasource:
    url: jdbc:h2:mem:prologue;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # 스키마는 엔티티에서 만든다 — 마이그레이션은 Postgres 전용이라 여기서 못 돈다
  flyway:
    enabled: false

jwt:
  secret: test-secret-only-for-context-loading-not-a-real-key
